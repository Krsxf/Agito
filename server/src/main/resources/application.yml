server:
  port: 8080

spring:
  application:
    name: anime-helper-server
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/anime_helper?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123456
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# Sa-Token 配置（token 有效期 2 小时，5.5.3节）
sa-token:
  token-name: Authorization
  timeout: 7200
  active-timeout: -1
  is-concurrent: true
  is-share: false
  token-style: uuid
  is-log: false

knife4j:
  enable: true
  setting:
    language: zh_cn

logging:
  level:
    com.agito.anime: info
  file:
    name: ./logs/anime-helper.log
  logback:
    rollingpolicy:
      max-history: 180
      total-size-cap: 200MB

# 项目自定义配置
anime:
  # 上传目录（封面等静态资源根目录，生产建议指向持久化磁盘并由 Nginx 托管）
  upload:
    dir: ./upload
  # 数据层降级开关（本机未装 Redis/ES 时的兼容方案，装上即切换）
  cache:
    type: caffeine          # caffeine | redis
    minutes: 30             # 推荐结果缓存周期，对应 rec_config.cache_minutes
  search:
    type: mysql             # mysql | elasticsearch
  # 合规边界：系统仅聚合元数据并跳转正版平台，不承载任何视频内容
  compliance:
    platform-whitelist:
      - 哔哩哔哩
      - 腾讯视频
      - 爱奇艺
      - 优酷
      - 芒果TV
